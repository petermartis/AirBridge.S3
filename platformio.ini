; AirBridge.S3 — Portable WiFi Access Point
; Hardware: Waveshare ESP32-S3-GEEK (1.14" ST7789 LCD)
;           or ESP32-S31 + external 1.8" ST7735 TFT (see [env:esp32s31])
;
; pioarduino hybrid build: Arduino 3.x/4.x + ESP-IDF 5.5/6.1
; (required for TinyUSB NCM networking and lwIP NAPT)

[platformio]
default_envs = esp32s3geek

; --- ESP32-S31 target ---------------------------------------------------
; The S31 (RISC-V, launched 2026) is not yet in pioarduino's main/develop
; boards/ tree. Its board definition ships only on the 61.04.00-RC1 tag
; (Arduino core 4.0.0-RC1 / ESP-IDF 6.1.0, both pre-release) as
; "esp32-s31-coreboard-1" — copied locally into boards/ below because
; there is no stable release to pull it from yet.
;
; Known open risk, unverified: patch_ecm_cmake.py patches esp_tinyusb /
; tinyusb sources with literal string matches taken from the IDF 5.5.5
; versions. If the IDF 6.1.0 managed-component sources differ, those
; patches can silently no-op (the script treats "no match" the same as
; "already patched") rather than fail the build. Check the pre:patch_ecm
; CMake configure-step output for "0 patch(es) applied" lines on first
; build of this env, and diff managed_components/espressif__tinyusb and
; espressif__esp_tinyusb against the strings in patch_ecm_cmake.py if so.
[env:esp32s31]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino, espidf

board_build.sdkconfig_defaults = sdkconfig.s31.defaults
board_build.partitions = partitions_16MB.csv
; The actual exclusion happens in src/CMakeLists.txt (this hybrid build's
; idf_component_register bypasses PlatformIO's own source filter); this is
; just so PIO's dependency scanner / IDE indexing agree.
build_src_filter = +<*> -<display_s3geek.cpp>

lib_ldf_mode = deep+
lib_compat_mode = off

build_flags =
    -DBOARD_HAS_PSRAM
    ; --- USB: native OTG mode, no Arduino CDC console ---
    ; (Set via sdkconfig; avoid redefining Arduino macros)
    ; --- Link Arduino panic handler wrapper (not auto-included in PIO hybrid build) ---
    -Wl,--wrap=esp_panic_handler

; Pinned exact (unlike esp32s3geek's floating ^1.2.0): patch_lovyangfx_s31.py
; targets specific line/text anchors in this library's source, verified
; against 1.2.31 specifically. A 1.2.30->1.2.31 patch bump already reshuffled
; line numbers and restructured Bus_SPI.hpp's DMA includes once; bump this
; pin deliberately and re-verify patch_lovyangfx_s31.py's docstring, not by
; accident on a routine `pio pkg update`.
lib_deps =
    lovyan03/LovyanGFX@1.2.31

extra_scripts = pre:generate_certs.py
                 pre:patch_tinyusb.py
                 pre:patch_lovyangfx_s31.py

monitor_speed = 115200
upload_speed = 460800

[env:esp32s3geek]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino, espidf

board_build.sdkconfig_defaults = sdkconfig.defaults
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
build_src_filter = +<*> -<display_s31.cpp>

lib_ldf_mode = deep+
lib_compat_mode = off

build_flags =
    -DBOARD_HAS_PSRAM
    ; --- USB: native OTG mode, no Arduino CDC console ---
    ; (Set via sdkconfig; avoid redefining Arduino macros)
    ; --- Link Arduino panic handler wrapper (not auto-included in PIO hybrid build) ---
    -Wl,--wrap=esp_panic_handler

lib_deps =
    lovyan03/LovyanGFX@^1.2.0

extra_scripts = pre:generate_certs.py
                 pre:patch_tinyusb.py

monitor_speed = 115200
upload_speed = 921600
