; Isolated diagnostic: drives Bus_IDF_SPI.h directly (writeCommand/
; writeData/writeDataRepeat), bypassing LovyanGFX's Panel_LCD/
; LGFX_Device entirely -- no Panel_ST7735_Minimal, no LGFX_Config_s31,
; no setColorDepth()/setRotation()/clear() auto-calls from
; init_impl(). Reproduces raw_spi_test's exact proven-working command
; sequence (SWRESET, SLPOUT, COLMOD=05, MADCTL=00, INVOFF, NORON,
; DISPON, then per-fill CASET/RASET/RAMWR+color) but through
; Bus_IDF_SPI's write methods instead of calling spi_device_transmit
; directly.
;
; Purpose: display_test (full LovyanGFX stack) still shows a blank
; white screen even after the byte-order bug in Bus_IDF_SPI's
; pack_lsb_first() was found and fixed (confirmed via hex dump: CASET/
; RASET/RAMWR bytes now match raw_spi_test exactly). This isolates
; whether Bus_IDF_SPI itself can drive the panel correctly when used
; the simplest possible way, bypassing every other layer -- separating
; "bug is in Bus_IDF_SPI" from "bug is in Panel_LCD/LGFX_Device's
; generic init/transaction machinery".
;
; Build + flash from this directory:
;   cd bus_idf_spi_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:esp32s31-busidfspitest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@1.2.31

extra_scripts = pre:../patch_lovyangfx_s31.py

monitor_speed = 115200
upload_speed = 460800
