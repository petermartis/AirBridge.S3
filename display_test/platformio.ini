; Isolated ESP32-S31 display diagnostic — pure Arduino framework (no
; ESP-IDF/CMake, no WiFi/USB/NAT), so this can't be affected by anything
; in the main AirBridge.S3 firmware. Exercises only LGFX_Config_s31.h to
; tell a display/wiring problem apart from a crash elsewhere in the app.
;
; Build + flash from this directory:
;   cd display_test
;   pio run -t upload
;   pio device monitor -b 115200
; (unlike the main firmware, USB isn't used for NCM here, so the normal
; USB-Serial console works — watch it for crash output / register dumps.)

[env:esp32s31-displaytest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino

; The board default is USB-OTG mode with CDC off; turn CDC-on-boot on so
; Serial works over the same USB port used to flash (no NCM here to
; conflict with, unlike the main firmware).
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@1.2.31

extra_scripts = pre:../patch_lovyangfx_s31.py

monitor_speed = 115200
upload_speed = 460800
