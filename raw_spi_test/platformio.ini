; Isolated diagnostic: the user's own proven-working raw esp-idf
; spi_master ST7735 test (built standalone with idf.py --preview and
; confirmed working on this exact board/panel/wiring), reproduced here
; byte-for-byte but compiled through PlatformIO's Arduino framework
; instead of a bare idf.py project.
;
; Purpose: display_test/ (LGFX_Config_s31.h via LovyanGFX) still shows
; a blank white screen after ruling out wiring, GPIO bank, SPI clock
; speed, SPI clock source, and the ST7735 init command table as causes
; — all confirmed byte-for-byte equivalent to this same raw test. The
; one variable never isolated: the raw test was built with a bare
; idf.py project, never through PlatformIO/Arduino. This project tests
; that specific variable by running the *identical* raw spi_master
; code through the Arduino/PlatformIO build instead.
;
; If this ALSO shows a blank screen: the bug is in the PlatformIO/
; Arduino-framework build environment itself (pin init, SPI GPIO
; routing via SPI.begin(), sdkconfig differences from idf.py --preview,
; etc.) — not in LovyanGFX, which can then stop being suspected further.
; If this works: the bug really is somewhere in LovyanGFX's own code
; path, and whatever's different between its Bus_SPI implementation and
; this raw sequence (despite everything already checked matching) is
; the next thing to isolate.
;
; Build + flash from this directory:
;   cd raw_spi_test
;   pio run -t upload
;   pio device monitor -b 115200

[env:esp32s31-rawspitest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/61.04.00-RC1/platform-espressif32.zip
board = esp32-s31-coreboard-1
framework = arduino

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
upload_speed = 460800
